name: japanese_learning
description: "Japanese learning Flutter application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: any
  go_router: any
  hive: any
  hive_flutter: any
  path_provider: any
  google_fonts: any
  shared_preferences: any
  flutter_svg: any
  audioplayers: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: any
  flutter_native_splash: any

flutter:
  uses-material-design: true
  assets:
    - assets/data/hiragana_lessons.json
    - assets/data/katakana_lessons.json
    - assets/data/kanji_lessons.json
    # Per-stroke polylines derived from KanjiVG (CC BY-SA 3.0) — see CREDITS.md.
    - assets/data/stroke_data.json
    - assets/audio/hiragana/
    - assets/audio/katakana/
    - assets/audio/kanji/
    # Legal/attribution documents, bundled so Settings can render the same
    # files that live at the repository root (single source of truth).
    - PRIVACY_POLICY.md
    - TERMS_OF_USE.md
    - CREDITS.md

# Placeholder v1.0 branding, generated from a simple torii-gate silhouette
# (see assets/branding/). These are temporary and meant to be replaced
# with real branding before a store listing. Android only for now — this
# project has no ios/ platform target yet; iOS icon/splash generation is
# deferred to a future milestone.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#4F6D5A"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"

flutter_native_splash:
  color: "#F7F4EE"
  image: "assets/branding/splash_logo.png"
  color_dark: "#171513"
  image_dark: "assets/branding/splash_logo.png"
  android: true
  ios: false
  android_gravity: center
  fullscreen: false
