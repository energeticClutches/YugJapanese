name: Flutter CI

# Phase 1 - Continuous Integration foundation: format check, static
# analysis, and the full test suite on every push and pull request.
# Phase 2 - Build Verification & Artifacts: once those pass, prove the app
# actually compiles by building a release APK and AAB, then upload both as
# workflow artifacts. Still validation-only - no signing beyond the debug
# key already checked into android/app/build.gradle, no deployment or
# publishing.
# Phase 3 - the JDK/Flutter install and pub/Gradle caching steps this
# workflow used to define inline now live in
# ./.github/actions/setup-flutter-build, shared with the tag-triggered
# Release workflow (release.yml) so both define the build environment in
# exactly one place. This workflow still owns validation (format/analyze/
# test) and build verification on every push and PR; it never creates a
# release - that trigger belongs solely to a `v*` tag push in release.yml.
# Phase 5 - tests now run with --coverage and coverage/lcov.info uploads
# as its own workflow artifact. Coverage is informational only here: no
# threshold is enforced and nothing fails based on the percentage.
# Milestone 30 - `push:` was previously unfiltered, and an unfiltered push
# event matches every ref, tags included. Pushing v1.0.0 therefore ran
# this workflow *and* release.yml against the same commit: two full
# format/analyze/test/build cycles for one release.
#
# `branches: '**'` restricts this trigger to branch pushes, so tag pushes
# no longer match and release tags run release.yml alone. Nothing is left
# unverified: a release commit is validated by CI on its branch before
# being tagged, and release.yml builds the artifacts it publishes. The
# pull_request trigger below is untouched.
#
# Do NOT "simplify" this to `tags-ignore: '**'`. That was tried first and
# silently disabled CI completely - GitHub only runs a push trigger for
# refs of a kind you filtered on, so defining tags-ignore alone makes the
# trigger tag-only, and ignoring every tag then leaves nothing that can
# ever match. `branches: '**'` is the correct inverse. `**` (not `*`) is
# required so branch names containing slashes still match, e.g.
# dependabot/github_actions/... - `*` stops at the first slash.
on:
  push:
    branches:
      - "**"
  pull_request:

# A newer push/PR update cancels any run already in progress for the same
# branch/PR, so the workflow doesn't queue up stale runs.
concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter build environment
        uses: ./.github/actions/setup-flutter-build

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Verify coverage report was generated
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::coverage/lcov.info was not generated by 'flutter test --coverage'."
            exit 1
          fi
          echo "Found coverage/lcov.info ($(wc -l < coverage/lcov.info) lines)."

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
